# Allowlist proxy: the mail bridge may reach Proton's servers and nothing else.
http_port 3128
acl proton dstdomain .proton.me .protonmail.ch .protonmail.com
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT proton
http_access deny all
# No caching, no forwarding headers, logs to stdout for `podman logs`
cache deny all
forwarded_for delete
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename none
pinger_enable off
