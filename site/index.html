<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <title>Agent</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Icons, drawn once and reused with <use>. -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-brief" viewBox="0 0 24 24"><path d="M12 3v2M5.6 5.6l1.4 1.4M3 12h2M19 12h2M17 7l1.4-1.4M7 17a5 5 0 1 1 10 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 20h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </svg>

  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <img class="logo" src="icon.svg" alt="" width="30" height="30">
        <h1>Agent</h1>
      </div>
      <nav class="tabs" aria-label="Sections">
        <a href="#brief" class="tab" data-view="brief"><svg><use href="#i-brief"/></svg><span>Brief</span></a>
        <a href="#emails" class="tab" data-view="emails"><svg><use href="#i-mail"/></svg><span>Emails</span><b class="count" hidden></b></a>
        <a href="#pushes" class="tab" data-view="pushes"><svg><use href="#i-bell"/></svg><span>Pushes</span></a>
      </nav>
      <span id="health" class="pill pill-muted">Loading…</span>
    </div>
  </header>

  <main>
    <div id="new-banner" class="new-banner" hidden></div>

    <section id="view-brief" class="view" data-view="brief" aria-labelledby="brief-title">
      <div class="hero">
        <p id="brief-day" class="eyebrow"></p>
        <h2 id="brief-title">Morning brief</h2>
        <p id="brief-headline" class="headline"></p>
      </div>
      <div id="brief-body" class="brief-grid">
        <p class="card muted empty">No brief yet.</p>
      </div>
      <h3 id="older-title" class="group" hidden>Earlier briefs</h3>
      <div id="brief-older"></div>
    </section>

    <section id="view-emails" class="view" data-view="emails" aria-labelledby="emails-title" hidden>
      <div class="view-head">
        <h2 id="emails-title">Emails</h2>
        <span id="email-count" class="muted"></span>
      </div>
      <div class="toolbar">
        <label class="search">
          <svg aria-hidden="true"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Search sender, subject or summary"
                 autocomplete="off" aria-label="Search emails">
        </label>
        <div class="toolbar-row">
          <div id="group-toggle" class="segmented" role="group" aria-label="Group emails">
            <button type="button" data-group="category">By category</button>
            <button type="button" data-group="date">By date</button>
          </div>
        </div>
        <div id="filters" class="chips" role="group" aria-label="Filter emails"></div>
      </div>
      <div id="email-list" class="list"></div>
    </section>

    <section id="view-pushes" class="view" data-view="pushes" aria-labelledby="pushes-title" hidden>
      <div class="view-head">
        <h2 id="pushes-title">Pushes sent</h2>
        <span class="muted">last 14 days</span>
      </div>
      <div id="push-list" class="list"></div>
    </section>

    <footer class="foot muted"><span id="generated"></span></footer>
  </main>
  <noscript><p class="card">This page needs JavaScript to show your data.</p></noscript>
</body>
</html>
